# The only manually selected FPGA application inputs.
# 00/01 boots s1; reset-time button value 10 boots s2.
#
# C3 (2026-09-21): the physical-board FPU display demo in `rcc/display-demo.rs`
# is back in the s2 slot. Its Q16.16 source relies on the C1 scalar, C2 vector
# and C3 special-function lowering; no software trig table is used.
format 1
s1 rcc/boot-demo.rs
s2 rcc/display-demo.rs
