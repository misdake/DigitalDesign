# The only manually selected FPGA application inputs.
# 00/01 boots s1; reset-time button value 10 boots s2.
#
# The S2 viewport GPU demo in `rcc/display-demo.rs` clears both slots to black
# once, then submits only the triangle and publishes each completed frame.
format 1
s1 rcc/boot-demo.rs
s2 rcc/display-demo.rs
