[package]
name = "cpu-v3-tang-nano-20k"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
cpu-v3-boot-format = { path = "boot-format" }
serde_json = "1"
syn = { version = "1", features = ["full", "visit"] }
gpu-v2 = { path = "../../ip/gpu-v2" }
cpu-v3 = { path = "../../ip/cpu-v3" }
rcc = { path = "../../compiler/rcc" }
digital-design-ip-common = { path = "../../ip/common" }
digital-design-circuit = { path = "../../circuit" }
digital-design-hardware = { path = "../../hardware/core" }
digital-design-hardware-common = { path = "../../hardware/common" }
digital-design-hardware-gowin = { path = "../../hardware/vendor/gowin" }
askama = { version = "0.14", default-features = false, features = ["config", "derive", "std"] }
minifb = { version = "0.24", optional = true }

[features]
display-window = ["dep:minifb"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_UI_Input_XboxController"] }

[dev-dependencies]
sha2 = "0.10.9"
cpu-v3-application = { path = "applications/image" }
cpu-v3-tools = { path = "tools/boot" }
serde_json = "1"

[[bin]]
name = "cpu-v3-system"
path = "src/bin/cpu-v3-system.rs"
test = false

# These CLI targets have no unit tests; keep their ordinary binaries available.

[[bin]]
name = "cpu-v3-display-sim"
path = "src/bin/cpu-v3-display-sim.rs"
test = false

[[bin]]
name = "cpu-v3-system-emu"
path = "src/bin/cpu-v3-system-emu.rs"
test = false

[[bin]]
name = "bloxorz-profile-runner"
path = "applications/bloxorz/tools/profile_runner.rs"

[[bin]]
name = "tankracer-static-workload"
path = "applications/tankracer/tools/workload.rs"
test = false

[[bin]]
name = "tankracer-gpu-timing"
path = "applications/tankracer/tools/gpu_timing/main.rs"
test = false

[[bin]]
name = "tankracer-cpu-timing"
path = "applications/tankracer/tools/cpu_timing.rs"
test = false

[[bin]]
name = "tankracer-physics-check"
path = "applications/tankracer/tools/physics_check.rs"
