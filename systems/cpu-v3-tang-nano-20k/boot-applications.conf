# The only manually selected FPGA application inputs.
# 00/01 boots s1; reset-time button value 10 boots s2.
#
# C0 boundary (2026-09-21): the physical-board FPU display demo is parked in
# `rcc/display-demo.rs` until FPU lowering lands in C1-C3. C0 freezes the
# Q16.16 contract and refuses every FPU operation, so the s2 slot boots the
# non-FPU `rcc/boot-alt.rs` in the meantime. Restore `s2 rcc/display-demo.rs`
# once C1-C3 lowering and the demo's Q16.16 source migration are complete.
format 1
s1 rcc/boot-demo.rs
s2 rcc/boot-alt.rs
