[package]
name = "cpu-v3-tang-nano-20k"
version = "0.1.0"
edition = "2021"

[dependencies]
gpu-v2 = { path = "../../ip/gpu-v2" }
cpu-v3 = { path = "../../ip/cpu-v3" }
rcc = { path = "../../compiler/rcc" }
digital-design-ip-common = { path = "../../ip/common" }
digital-design-circuit = { path = "../../circuit" }
digital-design-hardware = { path = "../../hardware/core" }
digital-design-hardware-common = { path = "../../hardware/common" }
digital-design-hardware-gowin = { path = "../../hardware/vendor/gowin" }
askama = { version = "0.14", default-features = false, features = ["config", "derive", "std"] }
minifb = { version = "0.24", optional = true }

[features]
display-window = ["dep:minifb"]

[build-dependencies]
syn = { version = "1", features = ["full"] }
serde_json = "1"
cpu-v3 = { path = "../../ip/cpu-v3" }
rcc = { path = "../../compiler/rcc" }

[dev-dependencies]
syn = { version = "1", features = ["full"] }
serde_json = "1"

# These CLI targets have no unit tests; keep their ordinary binaries available.

[[bin]]
name = "cpu-v3-display-sim"
path = "src/bin/cpu-v3-display-sim.rs"
test = false

[[bin]]
name = "cpu-v3-gpu-dump"
path = "src/bin/cpu-v3-gpu-dump.rs"
test = false

[[bin]]
name = "cpu-v3-pack"
path = "src/bin/cpu-v3-pack.rs"
test = false
