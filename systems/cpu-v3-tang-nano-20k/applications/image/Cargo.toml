[package]
name = "cpu-v3-application"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
cpu-v3-tools = { path = "../../tools/boot" }
serde_json = "1"

[build-dependencies]
cpu-v3-boot-format = { path = "../../boot-format" }
cpu-v3-tools = { path = "../../tools/boot" }
sha2 = "0.10.9"
syn = { version = "1", features = ["full"] }
serde_json = "1"
cpu-v3 = { path = "../../../../ip/cpu-v3" }
rcc = { path = "../../../../compiler/rcc" }

[[test]]
name = "application_artifact"
path = "tests/artifact.rs"
