[package]
name = "cpu-v3-tang-nano-20k"
version = "0.1.0"
edition = "2021"

[dependencies]
cpu-v3 = { path = "../../ip/cpu-v3" }
rcc = { path = "../../compiler/rcc" }
digital-design-ip-common = { path = "../../ip/common" }
digital-design-circuit = { path = "../../circuit" }
digital-design-hardware = { path = "../../hardware/core" }
digital-design-hardware-common = { path = "../../hardware/common" }
digital-design-hardware-gowin = { path = "../../hardware/vendor/gowin" }
askama = { version = "0.14", default-features = false, features = ["config", "derive", "std"] }
minifb = { version = "0.24", optional = true }

[features]
display-window = ["dep:minifb"]
# With neither flag, retain the board's 800x480 2x default.
display-2x = []
display-3x = []

[build-dependencies]
cpu-v3 = { path = "../../ip/cpu-v3" }
rcc = { path = "../../compiler/rcc" }
